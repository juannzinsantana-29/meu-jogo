
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Adventure</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #202820;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #f5d76e;
    margin: 10px 0 15px;
}

#game {
    position: relative;
    width: 900px;
    max-width: 95vw;
    height: min(550px, 85vh);
    min-height: 400px;
    margin: 0 auto;
    overflow: hidden;
    background: #6b8e23;
    border: 4px solid #3c5220;
    border-radius: 8px;
}

.path {
    position: absolute;
    left: 0;
    top: 45%;
    width: 100%;
    height: 70px;
    background: #c2a16a;
    z-index: 1;
}

.lake {
    position: absolute;
    right: 8%;
    top: 10%;
    width: 160px;
    height: 100px;
    background: #3498db;
    border: 5px solid #2471a3;
    border-radius: 50%;
    z-index: 2;
}

.tree {
    position: absolute;
    width: 50px;
    height: 50px;
    font-size: 42px;
    line-height: 50px;
    text-align: center;
    z-index: 4;
}

.tree1 {
    left: 10%;
    top: 15%;
}

.tree2 {
    left: 25%;
    bottom: 10%;
}

.tree3 {
    right: 20%;
    bottom: 15%;
}

.rock {
    position: absolute;
    width: 40px;
    height: 32px;
    background: linear-gradient(145deg, #d0d5d8, #858e95 60%, #626b72);
    border: 3px solid #505960;
    border-radius: 45% 55% 35% 40%;
    box-shadow: inset -4px -3px 0 #626b72;
    z-index: 4;
}

.rock1 {
    left: 42%;
    top: 20%;
}

.rock2 {
    right: 35%;
    bottom: 12%;
}

.coin {
    position: absolute;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
}

.coin span {
    display: block;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 30% 25%,
        #fff3a0,
        #ffc928 55%,
        #c98208
    );
    border: 3px solid #a96c08;
    box-shadow: 0 2px 0 #80530b;
}

.coin1 {
    left: 150px;
    top: 180px;
}

.coin2 {
    left: 300px;
    top: 300px;
}

.coin3 {
    right: 150px;
    top: 220px;
}

.coin4 {
    right: 300px;
    top: 100px;
}

.coin5 {
    left: 400px;
    bottom: 60px;
}

#player {
    position: absolute;
    width: 46px;
    height: 46px;
    background: #19baff;
    border: 3px solid #2471a3;
    border-radius: 8px;
    z-index: 5;
}

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 8px;
    text-align: left;
    line-height: 1.6;
    z-index: 10;
}

#controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 55px);
    justify-content: center;
    gap: 5px;
    margin: 15px auto;
}

#controls button {
    font-size: 24px;
    border: none;
    border-radius: 10px;
    background: #f5d76e;
    cursor: pointer;
    touch-action: manipulation;
}

#controls button:active {
    background: #e0b832;
}

#up {
    grid-column: 2;
    grid-row: 1;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}

.instructions {
    color: #ddd;
    font-size: 14px;
}

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    #game {
        width: 100%;
        height: 65vh;
        min-height: 400px;
    }
}
</style>
</head>

<body>

<h1>🎮 Pixel Adventure</h1>

<div id="game">

    <div class="path"></div>
    <div class="lake"></div>

    <div class="tree tree1">🌳</div>
    <div class="tree tree2">🌳</div>
    <div class="tree tree3">🌳</div>

    <div class="rock rock1 obstacle"></div>
    <div class="rock rock2 obstacle"></div>

    <div class="coin coin1"><span></span></div>
    <div class="coin coin2"><span></span></div>
    <div class="coin coin3"><span></span></div>
    <div class="coin coin4"><span></span></div>
    <div class="coin coin5"><span></span></div>

    <div id="hud">
        🪙 Moedas: <span id="coinCount">0</span>/5
        <br>
        📍 Explore o mapa!
    </div>

    <div id="player"></div>

</div>

<div id="controls">
    <button id="up" aria-label="Cima">⬆️</button>
    <button id="left" aria-label="Esquerda">⬅️</button>
    <button id="down" aria-label="Baixo">⬇️</button>
    <button id="right" aria-label="Direita">➡️</button>
</div>

<p class="instructions">
    Use as setas do teclado ou os botões para se movimentar.
    <br>
    Colete todas as moedas e explore o mapa!
</p>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const coinCount = document.getElementById("coinCount");

const speed = 5;

let playerX = 30;
let playerY = 30;
let coinsCollected = 0;

const keys = {
    ArrowUp: false,
    ArrowDown: false,
    ArrowLeft: false,
    ArrowRight: false,
    w: false,
    a: false,
    s: false,
    d: false
};

const collectedCoins = new Set();

function updatePlayer() {
    player.style.left = playerX + "px";
    player.style.top = playerY + "px";
}

function overlaps(a, b) {
    return !(
        a.right <= b.left ||
        a.left >= b.right ||
        a.bottom <= b.top ||
        a.top >= b.bottom
    );
}

function isBlocked(nextX, nextY) {
    const playerRect = {
        left: nextX,
        top: nextY,
        right: nextX + player.offsetWidth,
        bottom: nextY + player.offsetHeight
    };

    const obstacles = game.querySelectorAll(".obstacle");

    for (const obstacle of obstacles) {
        const rect = {
            left: obstacle.offsetLeft,
            top: obstacle.offsetTop,
            right: obstacle.offsetLeft + obstacle.offsetWidth,
            bottom: obstacle.offsetTop + obstacle.offsetHeight
        };

        if (overlaps(playerRect, rect)) {
            return true;
        }
    }

    return false;
}

function collectCoins() {
    const coins = game.querySelectorAll(".coin");

    coins.forEach((coin, index) => {
        if (collectedCoins.has(index)) return;

        const playerRect = {
            left: playerX,
            top: playerY,
            right: playerX + player.offsetWidth,
            bottom: playerY + player.offsetHeight
        };

        const coinRect = {
            left: coin.offsetLeft,
            top: coin.offsetTop,
            right: coin.offsetLeft + coin.offsetWidth,
            bottom: coin.offsetTop + coin.offsetHeight
        };

        if (overlaps(playerRect, coinRect)) {
            collectedCoins.add(index);
            coin.style.display = "none";

            coinsCollected++;
            coinCount.textContent = coinsCollected;

            if (coinsCollected === 5) {
                setTimeout(() => {
                    alert("Parabéns! Você coletou todas as moedas! 🎉");
                }, 100);
            }
        }
    });
}

function move(dx, dy) {
    const maxX = game.clientWidth - player.offsetWidth;
    const maxY = game.clientHeight - player.offsetHeight;

    const nextX = Math.max(0, Math.min(maxX, playerX + dx));
    const nextY = Math.max(0, Math.min(maxY, playerY + dy));

    if (!isBlocked(nextX, playerY)) {
        playerX = nextX;
    }

    if (!isBlocked(playerX, nextY)) {
        playerY = nextY;
    }

    updatePlayer();
    collectCoins();
}

document.addEventListener("keydown", event => {
    const key = event.key.length === 1
        ? event.key.toLowerCase()
        : event.key;

    if (key in keys) {
        keys[key] = true;
        event.preventDefault();
    }
});

document.addEventListener("keyup", event => {
    const key = event.key.length === 1
        ? event.key.toLowerCase()
        : event.key;

    if (key in keys) {
        keys[key] = false;
    }
});

function gameLoop() {
    let dx = 0;
    let dy = 0;

    if (keys.ArrowUp || keys.w) dy -= speed;
    if (keys.ArrowDown || keys.s) dy += speed;
    if (keys.ArrowLeft || keys.a) dx -= speed;
    if (keys.ArrowRight || keys.d) dx += speed;

    if (dx !== 0 && dy !== 0) {
        dx *= Math.SQRT1_2;
        dy *= Math.SQRT1_2;
    }

    if (dx !== 0 || dy !== 0) {
        move(dx, dy);
    }

    requestAnimationFrame(gameLoop);
}

function setupButton(id, dx, dy) {
    const button = document.getElementById(id);

    let interval = null;

    function startMoving(event) {
        event.preventDefault();

        if (interval !== null) return;

        move(dx * speed, dy * speed);

        interval = setInterval(() => {
            move(dx * speed, dy * speed);
        }, 40);
    }

    function stopMoving() {
        if (interval !== null) {
            clearInterval(interval);
            interval = null;
        }
    }

    button.addEventListener("pointerdown", startMoving);
    button.addEventListener("pointerup", stopMoving);
    button.addEventListener("pointerleave", stopMoving);
    button.addEventListener("pointercancel", stopMoving);
}

setupButton("up", 0, -1);
setupButton("down", 0, 1);
setupButton("left", -1, 0);
setupButton("right", 1, 0);

updatePlayer();
gameLoop();
</script>

</body>
</html>
