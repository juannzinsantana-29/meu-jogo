
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Adventure</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171717;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 900px;
            max-width: 95vw;
            height: 550px;
            height: min(550px, 85vh);
            min-height: 400px;
            background: #6b8e23;
            border: 5px solid #222;
            position: relative;
            overflow: hidden;
        }

        /* CAMINHO */
        .path {
            position: absolute;
            width: 100%;
            height: 70px;
            background: #c2a36b;
            top: 45%;
            left: 0;
            z-index: 0;
        }

        /* LAGO */
        .lake {
            position: absolute;
            width: 220px;
            height: 130px;
            background: #4da6d9;
            border: 5px solid #3285b4;
            border-radius: 50%;
            left: 35px;
            bottom: 35px;
            z-index: 1;
        }

        /* ÁRVORES */
        .tree {
            position: absolute;
            font-size: 45px;
            z-index: 2;
            line-height: 1.2;
        }

        .tree1 {
            left: 80px;
            top: 65px;
        }

        .tree2 {
            right: 100px;
            top: 100px;
        }

        .tree3 {
            left: 300px;
            bottom: 35px;
        }

        /* PEDRAS */
        .rock {
            position: absolute;
            font-size: 30px;
            z-index: 2;
            line-height: 1.2;
        }

        .rock1 {
            left: 350px;
            top: 90px;
        }

        .rock2 {
            right: 250px;
            bottom: 70px;
        }

        /* PERSONAGEM */
        #player {
            width: 46px;
            height: 46px;
            background: #4b7bec;
            border: 3px solid white;
            border-radius: 8px;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 5;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: #222b;
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
        }

        /* CONTROLES */
        #controls {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(2, 48px);
            gap: 5px;
            z-index: 20;
        }

        button {
            width: 48px;
            height: 48px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: #333;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background: #666;
        }

        #up {
            grid-column: 2;
            grid-row: 1;
        }

        #left {
            grid-column: 1;
            grid-row: 2;
        }

        #down {
            grid-column: 2;
            grid-row: 2;
        }

        #right {
            grid-column: 3;
            grid-row: 2;
        }
    </style>
</head>

<body>

<div id="game">

    <div class="path"></div>
    <div class="lake"></div>

    <div class="obstacle tree tree1">🌳</div>
    <div class="obstacle tree tree2">🌳</div>
    <div class="obstacle tree tree3">🌳</div>

    <div class="obstacle rock rock1">🪨</div>
    <div class="obstacle rock rock2">🪨</div>

    <div id="hud">
        ❤️ Vida: 100<br>
        ⭐ Moedas: 0
    </div>

    <div id="player"></div>

    <div id="controls">
        <button id="up" aria-label="Cima">⬆️</button>
        <button id="left" aria-label="Esquerda">⬅️</button>
        <button id="down" aria-label="Baixo">⬇️</button>
        <button id="right" aria-label="Direita">➡️</button>
    </div>

</div>

<script>
    const player = document.getElementById("player");
    const game = document.getElementById("game");

    let x = game.clientWidth / 2 - 23;
    let y = game.clientHeight / 2 - 23;

    const speed = 10;
    const playerSize = 46;

    // Coloca o personagem no centro do mapa
    function drawPlayer() {
        player.style.left = x + "px";
        player.style.top = y + "px";
    }

    // Verifica se existe algum obstáculo na nova posição
    function canMove(newX, newY) {
        const obstacles =
            document.querySelectorAll(".obstacle");

        const gameRect = game.getBoundingClientRect();

        const playerRect = {
            left: newX,
            right: newX + playerSize,
            top: newY,
            bottom: newY + playerSize
        };

        for (const obstacle of obstacles) {
            const rect = obstacle.getBoundingClientRect();

            const obstacleRect = {
                left: rect.left - gameRect.left -
                    game.clientLeft,
                right: rect.right - gameRect.left -
                    game.clientLeft,
                top: rect.top - gameRect.top -
                    game.clientTop,
                bottom: rect.bottom - gameRect.top -
                    game.clientTop
            };

            const collision =
                playerRect.right > obstacleRect.left &&
                playerRect.left < obstacleRect.right &&
                playerRect.bottom > obstacleRect.top &&
                playerRect.top < obstacleRect.bottom;

            if (collision) {
                return false;
            }
        }

        return true;
    }

    // Movimenta o personagem
    function move(dx, dy) {
        const newX = Math.max(
            0,
            Math.min(game.clientWidth - playerSize, x + dx)
        );

        const newY = Math.max(
            0,
            Math.min(game.clientHeight - playerSize, y + dy)
        );

        if (!canMove(newX, newY)) {
            return;
        }

        x = newX;
        y = newY;

        drawPlayer();
    }

    // Controles do teclado: WASD e setas
    document.addEventListener("keydown", function(event) {
        const key = event.key.toLowerCase();

        const keys = [
            "arrowup", "arrowdown",
            "arrowleft", "arrowright",
            "w", "a", "s", "d"
        ];

        if (keys.includes(key)) {
            event.preventDefault();
        }

        if (key === "arrowup" || key === "w") {
            move(0, -speed);
        }

        if (key === "arrowdown" || key === "s") {
            move(0, speed);
        }

        if (key === "arrowleft" || key === "a") {
            move(-speed, 0);
        }

        if (key === "arrowright" || key === "d") {
            move(speed, 0);
        }
    });

    // Controles para celular
    document.getElementById("up").addEventListener(
        "click", () => move(0, -speed)
    );

    document.getElementById("down").addEventListener(
        "click", () => move(0, speed)
    );

    document.getElementById("left").addEventListener(
        "click", () => move(-speed, 0)
    );

    document.getElementById("right").addEventListener(
        "click", () => move(speed, 0)
    );

    // Inicia o jogo
    drawPlayer();
</script>

</body>
</html>
