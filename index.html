<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Adventure</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #17251c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 12px 0;
    color: #9cff80;
    text-shadow: 2px 2px #23472b;
}

#menu {
    padding: 16px;
}

#classes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    max-width: 900px;
    margin: 15px auto;
}

.class-card {
    background: #263d2d;
    border: 2px solid #4f8156;
    color: white;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
}

.class-card:hover {
    background: #3b6043;
    border-color: #a5ff91;
}

.class-card strong {
    display: block;
    margin-bottom: 6px;
}

.class-card small {
    color: #d0e8d3;
}

button {
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: bold;
}

#start {
    background: #9cff80;
    color: #17321b;
    font-size: 16px;
    margin: 10px;
}

#game-wrap {
    display: none;
    padding: 8px;
}

#hud {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px auto;
    max-width: 900px;
}

.hud-box {
    background: #263d2d;
    border: 1px solid #6d9b71;
    border-radius: 8px;
    padding: 8px 12px;
}

#game {
    position: relative;
    width: min(900px, 96vw);
    height: min(540px, 62vh);
    min-height: 360px;
    margin: 0 auto;
    overflow: hidden;
    border: 4px solid #6a482c;
    border-radius: 8px;
    background:
        radial-gradient(ellipse at 20% 20%, #5da64c 0 4%, transparent 5%),
        radial-gradient(ellipse at 70% 60%, #4c9845 0 5%, transparent 6%),
        #4e9b43;
    touch-action: none;
}

.path {
    position: absolute;
    left: 0;
    top: 68%;
    width: 100%;
    height: 70px;
    background: #b79a63;
    border-top: 5px solid #8f7549;
    border-bottom: 5px solid #8f7549;
    z-index: 1;
}

.lake {
    position: absolute;
    width: 155px;
    height: 95px;
    right: 8%;
    top: 12%;
    border-radius: 50%;
    background: #3da9e8;
    border: 6px solid #83d8f4;
    z-index: 1;
}

.tree {
    position: absolute;
    width: 50px;
    height: 58px;
    font-size: 40px;
    line-height: 50px;
    text-align: center;
    z-index: 4;
    user-select: none;
    pointer-events: none;
}

.t1 { left: 15%; top: 15%; }
.t2 { left: 35%; top: 38%; }
.t3 { left: 70%; top: 43%; }
.t4 { left: 48%; top: 12%; }
.t5 { left: 12%; top: 76%; }
.t6 { left: 82%; top: 77%; }

.rock {
    position: absolute;
    width: 34px;
    height: 30px;
    font-size: 27px;
    z-index: 4;
    pointer-events: none;
}

.r1 { left: 56%; top: 53%; }
.r2 { left: 28%; top: 76%; }

.element {
    position: absolute;
    z-index: 2;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    border: 2px solid white;
    cursor: pointer;
}

.fire { left: 25%; top: 20%; background: #ed582e; }
.water { left: 60%; top: 23%; background: #248bea; }
.earth { left: 43%; top: 78%; background: #85512b; }
.ice { left: 76%; top: 27%; background: #70e6ff; }
.lightning { left: 53%; top: 35%; background: #e7c72c; }

#player {
    position: absolute;
    width: 30px;
    height: 34px;
    left: 50%;
    top: 58%;
    transform: translate(-50%, -50%);
    background: #168cff;
    border: 3px solid #d7f0ff;
    border-radius: 6px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    user-select: none;
}

#player.metamorpho {
    background: transparent;
    border: 0;
    font-size: 30px;
}

#player.form-fire { filter: drop-shadow(0 0 7px #ff5b21); }
#player.form-water { filter: drop-shadow(0 0 7px #35caff); }
#player.form-earth { filter: drop-shadow(0 0 7px #a66b38); }
#player.form-ice { filter: drop-shadow(0 0 7px #a5f4ff); }
#player.form-lightning { filter: drop-shadow(0 0 7px #fff36a); }

#message {
    min-height: 24px;
    color: #d8ffd2;
    margin: 8px;
}

#actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px;
}

.action {
    background: #344f3a;
    color: white;
    border: 1px solid #82bd85;
}

#mobile-controls {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 48px);
    gap: 5px;
    justify-content: center;
    margin: 12px auto;
    touch-action: none;
}

.move {
    background: #365c3d;
    color: white;
    font-size: 20px;
    border: 1px solid #9bd39b;
    user-select: none;
    touch-action: none;
}

.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }

#back {
    background: #9cff80;
    color: #17321b;
    margin: 8px;
}

@media (min-width: 700px) {
    #mobile-controls {
        opacity: 0.85;
    }
}
</style>
</head>

<body>

<h1>🌲 Pixel Adventure 🌲</h1>

<section id="menu">
    <h2>Escolha sua classe</h2>
    <p>Selecione uma classe para começar sua aventura.</p>
    <div id="classes"></div>
    <p id="class-info">Clique em uma classe para ver os detalhes.</p>
    <button id="start" disabled>Começar aventura</button>
</section>

<section id="game-wrap">
    <div id="hud">
        <div class="hud-box">🛡️ <span id="class-name">Aventureiro</span></div>
        <div class="hud-box">❤️ HP: <span id="hp">100</span>/100</div>
        <div class="hud-box">🔵 Mana: <span id="mana">100</span>/100</div>
        <div class="hud-box">🪙 Moedas: <span id="coins">0</span></div>
        <div class="hud-box">✨ Forma: <span id="form">Normal</span></div>
    </div>

    <div id="game">
        <div class="path"></div>
        <div class="lake"></div>

        <div class="tree t1 obstacle">🌳</div>
        <div class="tree t2 obstacle">🌳</div>
        <div class="tree t3 obstacle">🌳</div>
        <div class="tree t4 obstacle">🌳</div>
        <div class="tree t5 obstacle">🌳</div>
        <div class="tree t6 obstacle">🌳</div>

        <div class="rock r1 obstacle">🪨</div>
        <div class="rock r2 obstacle">🪨</div>

        <div class="element fire" data-element="fire" title="Fogo">🔥</div>
        <div class="element water" data-element="water" title="Água">💧</div>
        <div class="element earth" data-element="earth" title="Terra">🌱</div>
        <div class="element ice" data-element="ice" title="Gelo">❄️</div>
        <div class="element lightning" data-element="lightning" title="Raio">⚡</div>

        <div id="player" aria-label="Jogador"></div>
    </div>

    <div id="message">Use WASD ou as setas para andar.</div>

    <div id="actions">
        <button class="action" data-skill="1">Habilidade 1</button>
        <button class="action" data-skill="2">Habilidade 2</button>
        <button class="action" data-skill="3">Habilidade 3</button>
        <button class="action" id="collect">🪙 Coletar moeda</button>
    </div>

    <div id="mobile-controls">
        <button class="move up" data-dir="up">⬆️</button>
        <button class="move left" data-dir="left">⬅️</button>
        <button class="move down" data-dir="down">⬇️</button>
        <button class="move right" data-dir="right">➡️</button>
    </div>

    <button id="back">Voltar à seleção de classe</button>
</section>

<script>
const classData = [
    {
        name: "Guerreiro",
        icon: "⚔️",
        description: "Combatente equilibrado, especialista em ataques físicos.",
        skills: ["Golpe forte", "Defesa de ferro", "Corte poderoso"]
    },
    {
        name: "Mago",
        icon: "🧙",
        description: "Controla energias mágicas e ataca à distância.",
        skills: ["Bola mágica", "Escudo arcano", "Explosão arcana"]
    },
    {
        name: "Ninja",
        icon: "🥷",
        description: "Rápido e furtivo, especialista em movimentos ágeis.",
        skills: ["Corte veloz", "Passo das sombras", "Ataque surpresa"]
    },
    {
        name: "Arqueiro",
        icon: "🏹",
        description: "Ataca de longe com precisão.",
        skills: ["Flecha rápida", "Disparo triplo", "Chuva de flechas"]
    },
    {
        name: "Paladino",
        icon: "🛡️",
        description: "Guerreiro que combina proteção e energia sagrada.",
        skills: ["Golpe sagrado", "Barreira divina", "Luz purificadora"]
    },
    {
        name: "Assassino",
        icon: "🗡️",
        description: "Especialista em ataques rápidos e estratégicos.",
        skills: ["Lâmina veloz", "Desaparecer", "Ataque preciso"]
    },
    {
        name: "Cavaleiro das Trevas",
        icon: "🌑",
        description: "Usa poderes sombrios em combate.",
        skills: ["Corte sombrio", "Armadura negra", "Eclipse"]
    },
    {
        name: "Invocador",
        icon: "🔮",
        description: "Canaliza energia para invocar forças místicas.",
        skills: ["Espírito guardião", "Selo místico", "Invocação maior"]
    },
    {
        name: "Berserker",
        icon: "🪓",
        description: "Lutador agressivo que aposta na força bruta.",
        skills: ["Golpe brutal", "Fúria", "Impacto devastador"]
    },
    {
        name: "Druida",
        icon: "🍃",
        description: "Conecta-se à natureza e às suas energias.",
        skills: ["Raízes", "Cura natural", "Tempestade verde"]
    },
    {
        name: "Monge",
        icon: "🥋",
        description: "Combina disciplina, velocidade e energia interior.",
        skills: ["Punho firme", "Concentração", "Onda espiritual"]
    },
    {
        name: "Metamorfo Elemental",
        icon: "🌈",
        description: "Transforma-se ao entrar em contato com elementos.",
        skills: ["Pulso elemental", "Mudança de forma", "Explosão elemental"]
    }
];

const menu = document.getElementById("menu");
const gameWrap = document.getElementById("game-wrap");
const game = document.getElementById("game");
const player = document.getElementById("player");
const classContainer = document.getElementById("classes");
const classInfo = document.getElementById("class-info");
const startButton = document.getElementById("start");
const message = document.getElementById("message");

let selectedClass = null;
let coins = 0;
let hp = 100;
let mana = 100;
let x = 0;
let y = 0;
let currentForm = "";
let movementKeys = new Set();
let lastMoveTime = 0;

const speed = 3;
const playerWidth = 30;
const playerHeight = 34;

const elementInfo = {
    fire: { name: "Fogo", emoji: "🔥" },
    water: { name: "Água", emoji: "💧" },
    earth: { name: "Terra", emoji: "🌱" },
    ice: { name: "Gelo", emoji: "❄️" },
    lightning: { name: "Raio", emoji: "⚡" }
};

classData.forEach((item, index) => {
    const card = document.createElement("button");
    card.className = "class-card";
    card.innerHTML =
        `<strong>${item.icon} ${item.name}</strong><small>${item.description}</small>`;

    card.addEventListener("click", () => {
        selectedClass = item;
        document.querySelectorAll(".class-card").forEach(el => {
            el.style.borderColor = "#4f8156";
        });
        card.style.borderColor = "#d4ff80";
        classInfo.textContent =
            item.name + ": " + item.description +
            " Habilidades: " + item.skills.join(", ") + ".";
        startButton.disabled = false;
    });

    classContainer.appendChild(card);
});

function showMessage(text) {
    message.textContent = text;
}

function updateHUD() {
    document.getElementById("hp").textContent = hp;
    document.getElementById("mana").textContent = mana;
    document.getElementById("coins").textContent = coins;
    document.getElementById("form").textContent =
        currentForm ? elementInfo[currentForm].name : "Normal";
}

function setPlayerPosition() {
    player.style.left = x + "px";
    player.style.top = y + "px";
    player.style.transform = "none";
}

function overlaps(a, b) {
    return a.left < b.right &&
           a.right > b.left &&
           a.top < b.bottom &&
           a.bottom > b.top;
}

/* Colisão com árvores e pedras.
   Os obstáculos são medidos em relação ao mapa. */
function blocked(nextX, nextY) {
    const playerRect = {
        left: nextX,
        top: nextY,
        right: nextX + playerWidth,
        bottom: nextY + playerHeight
    };

    const obstacles = game.querySelectorAll(".obstacle");

    for (const obj of obstacles) {
        const left = obj.offsetLeft;
        const top = obj.offsetTop;

        /* Hitbox menor para não bloquear o jogador no espaço
           transparente acima das árvores. */
        let obstacleRect;

        if (obj.classList.contains("tree")) {
            obstacleRect = {
                left: left + 7,
                top: top + 23,
                right: left + obj.offsetWidth - 7,
                bottom: top + obj.offsetHeight
            };
        } else {
            obstacleRect = {
                left: left + 3,
                top: top + 5,
                right: left + obj.offsetWidth - 3,
                bottom: top + obj.offsetHeight - 2
            };
        }

        if (overlaps(playerRect, obstacleRect)) {
            return true;
        }
    }

    return false;
}

function getElementAtPlayer() {
    const playerRect = {
        left: x,
        top: y,
        right: x + playerWidth,
        bottom: y + playerHeight
    };

    for (const element of game.querySelectorAll(".element")) {
        const r = {
            left: element.offsetLeft,
            top: element.offsetTop,
            right: element.offsetLeft + element.offsetWidth,
            bottom: element.offsetTop + element.offsetHeight
        };

        if (overlaps(playerRect, r)) {
            return element.dataset.element;
        }
    }

    return null;
}

function updateTransformation() {
    if (!selectedClass || selectedClass.name !== "Metamorfo Elemental") {
        return;
    }

    const element = getElementAtPlayer();

    if (element && element !== currentForm) {
        currentForm = element;
        player.className = "metamorpho form-" + element;
        player.textContent = elementInfo[element].emoji;
        showMessage("Você se transformou em " + elementInfo[element].name + "!");
        updateHUD();
    }
}

function move(dx, dy) {
    if (!selectedClass || gameWrap.style.display === "none") return;

    const maxX = game.clientWidth - playerWidth;
    const maxY = game.clientHeight - playerHeight;
    const nextX = Math.max(0, Math.min(maxX, x + dx));
    const nextY = Math.max(0, Math.min(maxY, y + dy));

    /* Verifica cada eixo separadamente para permitir deslizar
       ao longo de uma árvore ou pedra. */
    if (!blocked(nextX, y)) x = nextX;
    if (!blocked(x, nextY)) y = nextY;

    setPlayerPosition();
    updateTransformation();
}

function startGame() {
    if (!selectedClass) return;

    menu.style.display = "none";
    gameWrap.style.display = "block";

    document.getElementById("class-name").textContent = selectedClass.name;

    x = Math.max(0, (game.clientWidth - playerWidth) / 2);
    y = Math.max(0, (game.clientHeight - playerHeight) / 2);

    player.className = "";
    player.id = "player";
    player.textContent = selectedClass.icon;
    player.style.background = selectedClass.name === "Metamorfo Elemental"
        ? "transparent" : "#168cff";
    player.style.border = selectedClass.name === "Metamorfo Elemental"
        ? "0" : "3px solid #d7f0ff";

    if (selectedClass.name === "Metamorfo Elemental") {
        player.classList.add("metamorpho");
    }

    currentForm = "";
    coins = 0;
    hp = 100;
    mana = 100;

    setPlayerPosition();
    updateHUD();
    showMessage("A aventura começou! Explore o mapa e encontre os elementos.");
}

startButton.addEventListener("click", startGame);

document.getElementById("back").addEventListener("click", () => {
    gameWrap.style.display = "none";
    menu.style.display = "block";
    movementKeys.clear();
});

document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();
    const valid = ["arrowup", "arrowdown", "arrowleft", "arrowright",
                   "w", "a", "s", "d"];

    if (valid.includes(key)) {
        event.preventDefault();
        movementKeys.add(key);
    }
});

document.addEventListener("keyup", event => {
    movementKeys.delete(event.key.toLowerCase());
});

window.addEventListener("blur", () => movementKeys.clear());

function movementLoop(timestamp) {
    if (timestamp - lastMoveTime >= 16) {
        let dx = 0;
        let dy = 0;

        if (movementKeys.has("arrowup") || movementKeys.has("w")) dy -= speed;
        if (movementKeys.has("arrowdown") || movementKeys.has("s")) dy += speed;
        if (movementKeys.has("arrowleft") || movementKeys.has("a")) dx -= speed;
        if (movementKeys.has("arrowright") || movementKeys.has("d")) dx += speed;

        if (dx && dy) {
            dx *= Math.SQRT1_2;
            dy *= Math.SQRT1_2;
        }

        if (dx || dy) move(dx, dy);
        lastMoveTime = timestamp;
    }

    requestAnimationFrame(movementLoop);
}

requestAnimationFrame(movementLoop);

/* Controles para celular */
document.querySelectorAll(".move").forEach(button => {
    const direction = button.dataset.dir;
    const keyByDirection = {
        up: "arrowup",
        down: "arrowdown",
        left: "arrowleft",
        right: "arrowright"
    };

    button.addEventListener("pointerdown", event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        movementKeys.add(keyByDirection[direction]);
    });

    function release() {
        movementKeys.delete(keyByDirection[direction]);
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
});

document.getElementById("collect").addEventListener("click", () => {
    coins += 1;
    updateHUD();
    showMessage("Você coletou uma moeda! Total: " + coins + ".");
});

document.querySelectorAll("[data-skill]").forEach(button => {
    button.addEventListener("click", () => {
        if (!selectedClass) return;

        if (mana < 10) {
            showMessage("Mana insuficiente para usar a habilidade!");
            return;
        }

        mana -= 10;
        updateHUD();

        const skillIndex = Number(button.dataset.skill) - 1;
        const skillName = selectedClass.skills[skillIndex];

        showMessage(skillName + " ativada! (Demonstração: combate ainda não implementado.)");
    });
});

window.addEventListener("resize", () => {
    if (gameWrap.style.display === "none") return;

    x = Math.min(x, game.clientWidth - playerWidth);
    y = Math.min(y, game.clientHeight - playerHeight);

    setPlayerPosition();
});
</script>

</body>
</html>
